<!-- FAVICON
     Desenhado para 16px, que e o tamanho em que ele realmente aparece.

     A versao anterior era o escudo em CONTORNO dourado fino. Contorno de
     3px num quadrado de 64 vira meio pixel a 16px: sumia. Aqui o escudo e
     CHEIO, e o "P" e vazado nele em marinho. O que se le a 16px e a
     silhueta e o contraste entre os dois, nao a linha.

     Nao uso o escudo.png porque ele e contorno fino sobre fundo
     transparente: mesmo problema, e ainda por cima sem fundo para
     contrastar com a aba do navegador. Ele entra como apple-touch-icon,
     onde aparece grande.
     -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0a2368"/>
  <path d="M32 7c-2.2 4.6-8.4 6.4-16 6.4v20.9c0 9.2 6.6 15.8 16 20.7 9.4-4.9 16-11.5 16-20.7V13.4c-7.6 0-13.8-1.8-16-6.4z"
        fill="#c4a961"/>
  <path d="M25.5 21.5h9a7 7 0 0 1 0 14h-4.5v9h-4.5z"
        fill="#0a2368"/>
  <circle cx="34.5" cy="28.5" r="2.6" fill="#c4a961"/>
</svg>
